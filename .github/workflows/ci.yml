name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install linting tools
        run: pip install flake8 isort
      - name: Flake8 (syntax & import errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Check import order
        run: isort --check-only --diff data/ models/ utils/ experiments/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validate imports
        run: python validate_imports.py

      - name: Run unit tests
        run: python -m pytest tests/test_models.py -v --tb=short

      - name: Run validation tests
        run: python -m pytest tests/test_validation.py -v --tb=short

      - name: Run all tests with coverage
        run: python -m pytest tests/ -v --cov=models --cov=data --cov=utils --cov-report=term-missing --tb=short

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -r requirements.txt
          pip install pyright
      - name: Type check core modules
        run: pyright models/ data/ utils/ --level basic
        continue-on-error: true
